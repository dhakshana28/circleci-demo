version: 2.1

jobs:
  build_test:
    docker:
      - image: cimg/python:3.12

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: python -m pip install -r requirements.txt

      - run:
          name: Compile Python files
          command: python -m compileall -q app.py test_app.py

      - run:
          name: Code quality check
          command: python -m ruff check .

      - run:
          name: Run automated tests
          command: |
            mkdir -p test-results
            python -m pytest -v --junitxml=test-results/junit.xml

      - store_test_results:
          path: test-results

      - run:
          name: Create release artifact
          command: |
            mkdir -p dist
            python -c "import zipfile; z=zipfile.ZipFile('dist/app.zip','w'); [z.write(f) for f in ['app.py','requirements.txt']]; z.close()"

      - store_artifacts:
          path: dist
          destination: release

  deploy:
    docker:
      - image: cimg/base:stable

    steps:
      - run:
          name: Trigger Render deployment
          command: |
            test -n "$RENDER_DEPLOY_HOOK_URL"
            curl --fail --silent --show-error \
              -X POST "$RENDER_DEPLOY_HOOK_URL"

  smoke_test:
    docker:
      - image: cimg/base:stable

    steps:
      - run:
          name: Verify deployed application
          command: |
            test -n "$APP_URL"

            for i in $(seq 1 30); do
              if response=$(curl --fail --silent "$APP_URL") &&
                 echo "$response" | grep -F \
                 "CircleCI CI/CD pipeline is working!"; then
                echo "Deployment verification passed"
                exit 0
              fi
              echo "Waiting for deployment..."
              sleep 10
            done

            echo "Deployment verification failed"
            exit 1

workflows:
  ci_cd_pipeline:
    jobs:
      - build_test

      - deploy:
          requires:
            - build_test
          filters:
            branches:
              only: main

      - smoke_test:
          requires:
            - deploy
          filters:
            branches:
              only: main